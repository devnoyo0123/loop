<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="100%">
      <stop offset="0%" stop-color="#171D2B"/>
      <stop offset="55%" stop-color="#10141D"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </radialGradient>
    <linearGradient id="arc" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7DE2C3"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- 앱 마크 (중앙 상단) -->
  <g transform="translate(512 138) scale(0.30) translate(-512 -480)">
    <circle cx="330" cy="730" r="36" fill="#6E5BAE"/>
    <path d="M 372 730 C 856 730, 856 294, 478 294"
          fill="none" stroke="url(#arc)" stroke-width="56" stroke-linecap="round"/>
    <polygon points="402,294 528,236 528,352" fill="#7DE2C3"/>
    <circle cx="330" cy="294" r="54" fill="#7DE2C3"/>
  </g>

  <!-- 워드마크 -->
  <text x="512" y="330" text-anchor="middle"
        font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif"
        font-size="96" font-weight="700" letter-spacing="6" fill="#E8EAED">Loop</text>

  <!-- 태그라인 -->
  <text x="512" y="398" text-anchor="middle"
        font-family="'Apple SD Gothic Neo',sans-serif"
        font-size="31" letter-spacing="2" fill="#9AA0A6">흘러간 하루를 다시 돌리는 기록</text>
</svg>
