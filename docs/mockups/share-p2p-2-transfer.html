<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:390px; height:844px; background:#0B0D12; overflow:hidden; position:relative;
    font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; color:#E8EAF2;
  }
  .ribbon { position:absolute; top:-48px; right:-48px; width:150px; height:150px;
    transform:rotate(45deg); z-index:9;
    background:repeating-linear-gradient(90deg,#7E1E2B 0 16px,#F5F0EA 16px 30px,#7E1E2B 30px 52px); }
  .wrap { position:absolute; inset:0; padding:64px 20px 24px; display:flex; flex-direction:column; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .title { font-size:19px; font-weight:700; }
  .close { font-size:15px; color:#8B90A0; }
  .stage { font-size:13.5px; color:#7DE2C3; margin:10px 2px 18px; }
  .device { background:#12151D; border:1.5px solid #7DE2C3; border-radius:16px; padding:16px;
    display:flex; align-items:center; gap:13px; }
  .check { width:34px; height:34px; border-radius:50%; background:#7DE2C3; color:#0B0D12;
    font-size:18px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .device .n { font-size:16px; font-weight:700; }
  .device .s { font-size:12.5px; color:#7DE2C3; margin-top:3px; }
  .chain { background:#12151D; border:1px solid #262B3A; border-radius:16px; padding:15px 16px; margin-top:14px; }
  .chain .t { font-size:14px; line-height:1.5; }
  .chain .m { font-size:12px; color:#8B90A0; margin-top:6px; }
  .mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .pct { text-align:center; font-size:52px; font-weight:800; color:#7DE2C3; letter-spacing:-1px; }
  .pct small { font-size:22px; font-weight:700; margin-left:2px; }
  .prog-label { display:flex; justify-content:space-between; font-size:13px; color:#8B90A0; margin:22px 2px 10px; }
  .prog-label b { color:#E8EAF2; font-size:15px; }
  .bar { height:10px; border-radius:5px; background:#1A1E2A; overflow:hidden; }
  .bar i { display:block; height:100%; width:68%; border-radius:5px; background:#7DE2C3; }
  .meta { text-align:center; font-size:12.5px; color:#8B90A0; margin-top:12px; }
  .hint { background:#12151D; border:1px solid #262B3A; border-radius:14px; padding:14px 15px;
    display:flex; gap:10px; align-items:flex-start; }
  .hint .i { color:#7DE2C3; font-size:16px; }
  .hint .l { font-size:13px; line-height:1.55; color:#C9CDD9; }
  .cancel { display:block; width:100%; text-align:center; background:none; border:none; color:#8B90A0;
    font-size:14.5px; padding:16px 0 4px; font-family:inherit; }
</style>
</head>
<body>
  <div class="ribbon"></div>
  <div class="wrap">
    <div class="head">
      <div class="title">가까운 기기로 보내기</div>
      <div class="close">닫기</div>
    </div>
    <div class="stage">지민의 기기를 찾았어요</div>

    <div class="device">
      <div class="check">✓</div>
      <div>
        <div class="n">Galaxy S25</div>
        <div class="s">지민 · 연결됨</div>
      </div>
    </div>

    <div class="chain">
      <div class="t">물 하루 8잔 마시기 — 3주째 도전 중</div>
      <div class="m">기록 52개 · 사진 3장 · 동영상 1개 · 위치 정보 제외됨</div>
    </div>

    <div class="mid">
      <div class="pct">68<small>%</small></div>
      <div class="prog-label"><span>전송 중</span><b>32 / 47MB</b></div>
      <div class="bar"><i></i></div>
      <div class="meta">Wi-Fi Direct — 두 기기가 직접 주고받아요</div>
    </div>

    <div class="hint">
      <div class="i">🔒</div>
      <div class="l">인터넷·서버를 전혀 거치지 않아요. 보통 몇십 초 안에 끝나요.</div>
    </div>
    <button class="cancel">취소</button>
  </div>
</body>
</html>
