<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:390px; height:844px; background:#0B0D12; overflow:hidden; position:relative;
    font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; color:#E8EAF2;
  }
  .ribbon { position:absolute; top:-48px; right:-48px; width:150px; height:150px;
    transform:rotate(45deg); z-index:9;
    background:repeating-linear-gradient(90deg,#7E1E2B 0 16px,#F5F0EA 16px 30px,#7E1E2B 30px 52px); }
  /* 뒷배경: 사슬 보기 화면 (딤) */
  .bg { position:absolute; inset:0; padding:60px 16px 0; filter:brightness(.45); }
  .bg h1 { font-size:28px; font-weight:800; margin-bottom:20px; }
  .card { background:#12151D; border:1px solid #262B3A; border-radius:14px; padding:14px; margin-bottom:12px; }
  .card .t { font-size:14px; line-height:1.5; }
  .card .m { font-size:12px; color:#8B90A0; margin-top:6px; }
  .reply { margin-left:22px; background:#12151D; border:1px solid #262B3A; border-radius:14px; padding:14px; }
  .dim { position:absolute; inset:0; background:rgba(4,5,9,.45); }
  /* 시트 */
  .sheet { position:absolute; left:0; right:0; bottom:0; background:#12151D;
    border-radius:20px 20px 0 0; padding:22px 20px 18px; box-shadow:0 -8px 40px rgba(0,0,0,.5); }
  .sheet-title { font-size:19px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .sheet-title .loop-mark { color:#7DE2C3; }
  .origin { background:#1A1E2A; border-radius:12px; padding:13px 14px; margin:14px 0 12px; }
  .origin .t { font-size:13.5px; line-height:1.5; }
  .origin .m { font-size:12px; color:#8B90A0; margin-top:5px; }
  .counts { display:flex; gap:8px; margin-bottom:16px; }
  .count { flex:1; background:#1A1E2A; border-radius:10px; padding:9px 0; text-align:center; }
  .count .n { font-size:15px; font-weight:700; color:#7DE2C3; }
  .count .l { font-size:11px; color:#8B90A0; margin-top:2px; }
  .opt { display:flex; align-items:center; justify-content:space-between; padding:12px 2px; }
  .opt + .opt { border-top:1px solid #262B3A; }
  .opt .l { font-size:14.5px; }
  .opt .d { font-size:12px; color:#8B90A0; margin-top:3px; }
  .toggle { width:44px; height:26px; border-radius:13px; background:#262B3A; position:relative; flex:none; }
  .toggle::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#8B90A0; }
  .toggle.on { background:#7DE2C3; }
  .toggle.on::after { left:auto; right:3px; background:#0B0D12; }
  .btn { display:block; width:100%; border:none; border-radius:28px; background:#A78BFA; color:#0B0D12;
    font-size:16px; font-weight:700; padding:16px 0; text-align:center; margin-top:16px; font-family:inherit; }
  .sub { display:block; width:100%; text-align:center; background:none; border:none; color:#8B90A0;
    font-size:13.5px; padding:13px 0 2px; font-family:inherit; }
</style>
</head>
<body>
  <div class="ribbon"></div>
  <div class="bg">
    <h1>Loop</h1>
    <div class="card">
      <div class="t">물 하루 8잔 마시기 — 3주째 도전 중</div>
      <div class="m">10.12 08:30 · 이어쓰기 51회 · 🔁 2시간마다</div>
    </div>
    <div class="card">
      <div class="t">오후에 다시 마셨다. 습관이 잡히는 느낌</div>
      <div class="m">10.13 14:20 · 사진 1장</div>
    </div>
    <div class="reply">
      <div class="t">지금 5잔째. 점심 전에 한 잔 더</div>
      <div class="m">10.14 11:05</div>
    </div>
  </div>
  <div class="dim"></div>

  <div class="sheet">
    <div class="sheet-title"><span class="loop-mark">↩</span> 사슬 공유</div>
    <div class="origin">
      <div class="t">물 하루 8잔 마시기 — 3주째 도전 중</div>
      <div class="m">10.12 시작 · 이어쓰기 51회</div>
    </div>
    <div class="counts">
      <div class="count"><div class="n">52</div><div class="l">기록</div></div>
      <div class="count"><div class="n">3</div><div class="l">사진</div></div>
      <div class="count"><div class="n">1</div><div class="l">동영상</div></div>
      <div class="count"><div class="n">48</div><div class="l">반복</div></div>
    </div>
    <div class="opt">
      <div><div class="l">위치 정보 빼고 보내기</div><div class="d">기록에 남은 장소·좌표는 빠져요</div></div>
      <div class="toggle on"></div>
    </div>
    <div class="opt">
      <div><div class="l">사진·동영상 빼고 보내기</div><div class="d">텍스트 기록만 가요 — 46KB</div></div>
      <div class="toggle"></div>
    </div>
    <button class="btn">가까운 기기로 보내기</button>
    <button class="sub">파일로 내보내기 (.looplog)</button>
  </div>
</body>
</html>
